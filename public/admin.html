<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Cart - Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        if (localStorage.getItem('userRole') !== 'admin') window.location.href = 'login.html';
        if (localStorage.getItem('darkMode') === 'enabled') document.documentElement.classList.add('dark-mode');
    </script>
</head>
<body class="admin-body">
    <div id="toast" class="toast hidden"></div>

    <header>
        <div class="logo">Happy Cart | Manager Dashboard</div>
        <div>
            <span id="adminGreeting" style="margin-right: 20px; font-weight: bold; color:white;"></span>
            <button id="themeToggle" class="secondary-btn">🌙</button>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="admin-container" style="flex-direction: column;">
        <section class="dashboard-stats">
            <div class="stat-card"><h3>Total Revenue</h3><h2 id="statRev" style="color:var(--text-color);">₹0.00</h2></div>
            <div class="stat-card"><h3>Total Orders</h3><h2 id="statOrders" style="color:var(--text-color);">0</h2></div>
            <div class="stat-card"><h3>Processing</h3><h2 id="statPending" style="color:#DA291C;">0</h2></div>
            <div class="stat-card"><h3>Delivered</h3><h2 id="statDelivered" style="color:green;">0</h2></div>
        </section>

        <section class="chart-section" style="background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; max-width: 800px; margin: 0 auto 20px auto; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h2 style="text-align: center; margin-bottom: 10px; color:var(--text-color);">Recent Revenue Trend</h2>
            <canvas id="revenueChart" height="100"></canvas>
        </section>

        <div style="display: flex; gap: 40px; width: 100%;">
            <section class="admin-form-section" style="flex: 1;">
                <h2>Add New Grocery Item</h2>
                <form id="addProductForm">
                    <input type="text" id="prodName" placeholder="Product Name" required>
                    <input type="number" id="prodPrice" step="0.01" placeholder="Price" required>
                    <select id="prodCategory" required>
                        <option value="" disabled selected>Category</option>
                        <option value="Fruits & Vegetables">Fruits & Vegetables</option>
                        <option value="Dairy, Bread & Eggs">Dairy, Bread & Eggs</option>
                        <option value="Snacks & Munchies">Snacks & Munchies</option>
                        <option value="Chicken, Meat & Fish">Chicken, Meat & Fish</option>
                    </select>
                    <label style="margin:10px 0;"><input type="checkbox" id="prodIsVeg"> Is Vegetarian?</label>
                    <input type="text" id="prodImage" placeholder="Image URL">
                    <button type="submit" class="admin-btn">Add to Inventory</button>
                </form>
            </section>
            <section class="admin-inventory-section" style="flex: 1;">
                <h2>Inventory</h2>
                <div id="inventoryList" style="max-height: 400px; overflow-y:auto;"></div>
            </section>
        </div>
    </main>

    <section class="admin-orders-section" style="margin: 0 40px 40px 40px; background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h2>Live Order Tickets</h2>
        <div id="orderList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 20px;"></div>
    </section>

    <script src="admin.js"></script>
</body>
</html>
